<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.id} ? '编辑分类' : '新增分类'">分类表单</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h3 th:text="${category.id} ? '编辑分类' : '新增分类'"></h3>
    <form th:action="@{/admin/category/save}" method="post" th:object="${category}">
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label>名称</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>描述</label>
            <input type="text" th:field="*{description}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a th:href="@{/admin/category/list}" class="btn btn-secondary">返回</a>
    </form>
</body>
</html>
