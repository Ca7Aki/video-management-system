<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>视频分类查询系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">视频分类查询系统</h2>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
        <div th:if="${param.error}" class="text-danger mt-2">用户名或密码错误</div>
        <div th:if="${param.logout}" class="text-info mt-2">您已安全退出</div>
    </form>
</body>
</html>
